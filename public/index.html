<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Insta-Unfollow</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="logo">
        <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M8 12h8"/><path d="M12 8v8"/></svg>
        <h1>Insta-Unfollow</h1>
      </div>
      <div class="header-status" id="headerStatus">Disconnected</div>
    </header>

    <main class="main">
      <!-- Login Section -->
      <section class="card" id="loginSection">
        <h2>Connect Instagram</h2>
        <p class="subtitle">Log in to your Instagram account to start unfollowing non-followers.</p>
        <div class="login-actions">
          <button class="btn btn-primary" id="loginBtn" onclick="doLogin()">Login with Instagram</button>
          <p class="hint">A browser window will open. Log in there.</p>
        </div>
      </section>

      <!-- Dashboard -->
      <section class="card hidden" id="dashboardSection">
        <div class="profile-info" id="profileInfo">
          <div class="avatar" id="avatarPlaceholder"></div>
          <div>
            <h2 id="profileUsername">-</h2>
            <p class="subtitle" id="profileStats">- following / - followers</p>
          </div>
        </div>

        <div class="stats-grid">
          <div class="stat">
            <div class="stat-value" id="statFollowing">-</div>
            <div class="stat-label">Following</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="statFollowers">-</div>
            <div class="stat-label">Followers</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="statNonFollowers">-</div>
            <div class="stat-label">Non-Followers</div>
          </div>
          <div class="stat">
            <div class="stat-value" id="statUnfollowed">-</div>
            <div class="stat-label">Unfollowed</div>
          </div>
        </div>

        <div class="controls">
          <button class="btn btn-primary" id="startBtn" onclick="doStart()">Start Unfollowing</button>
          <button class="btn btn-secondary hidden" id="pauseBtn" onclick="doPause()">Pause</button>
          <button class="btn btn-danger hidden" id="stopBtn" onclick="doStop()">Stop</button>
          <button class="btn btn-secondary" onclick="doPreview()">Scan</button>
        </div>

        <div class="progress-bar hidden" id="progressBar">
          <div class="progress-fill" id="progressFill"></div>
          <div class="progress-text" id="progressText">0 / 0</div>
        </div>
      </section>

      <!-- Settings -->
      <section class="card" id="settingsSection">
        <h3>Settings</h3>
        <div class="settings-grid">
          <div class="setting">
            <label>Hourly Limit</label>
            <input type="number" id="hourlyLimit" value="200" min="1" max="600">
          </div>
          <div class="setting">
            <label>Daily Limit</label>
            <input type="number" id="dailyLimit" value="1000" min="1" max="5000">
          </div>
          <div class="setting">
            <label>Min Delay (sec)</label>
            <input type="number" id="minDelay" value="4" min="1" max="30">
          </div>
          <div class="setting">
            <label>Max Delay (sec)</label>
            <input type="number" id="maxDelay" value="7" min="1" max="30">
          </div>
          <div class="setting">
            <label>Break Every</label>
            <input type="number" id="breakEvery" value="60" min="5" max="200">
          </div>
          <div class="setting">
            <label>Break (min)</label>
            <input type="number" id="breakMin" value="1" min="1" max="10">
          </div>
        </div>
      </section>

      <!-- Logs -->
      <section class="card">
        <h3>Activity Log</h3>
        <div class="log-container" id="logContainer">
          <p class="log-empty">No activity yet.</p>
        </div>
      </section>
    </main>
  </div>

  <script src="app.js"></script>
</body>
</html>
